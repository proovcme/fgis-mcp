[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fgis-mcp"
version = "0.3.0"
description = "Standalone MCP access to public FGIS CS data and reproducible local datasets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "openpyxl>=3.1.5,<4", "pyarrow>=20,<24", "platformdirs>=4,<5", "filelock>=3.16,<4", "truststore>=0.10,<1"]

[project.urls]
Repository = "https://github.com/proovcme/fgis-mcp"
Issues = "https://github.com/proovcme/fgis-mcp/issues"

[project.scripts]
fgis-mcp = "fgis_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/fgis_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
